plugins { id 'com.android.application' }

android {
    namespace 'tv.mistick.proxy'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'tv.mistick.proxy'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '1.7.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23', 'APP_OPTIM=release'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'src/main/cpp/hev/Android.mk' }
    }

    // Пароли подписи не хранятся в репозитории: keystore.properties (локально, в .gitignore)
    // или переменные окружения MISTICK_STORE_PASSWORD / MISTICK_KEY_PASSWORD.
    def keystoreFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }
    def signingStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('MISTICK_STORE_PASSWORD')
    def signingKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('MISTICK_KEY_PASSWORD')

    signingConfigs {
        local {
            storeFile file('../keystore/mistick.jks')
            keyAlias 'mistick'
            if (signingStorePassword != null) {
                storePassword signingStorePassword
            }
            if (signingKeyPassword != null) {
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.local
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.local
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }

    testOptions {
        unitTests.all {
            // org.json из testImplementation перекрывает заглушки android.jar
            it.systemProperty 'java.awt.headless', 'true'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
