plugins { id 'com.android.application' }

android {
    namespace 'tv.mistick.proxy'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'tv.mistick.proxy'
        minSdk 23
        targetSdk 30
        versionCode 3
        versionName '1.0.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23', 'APP_OPTIM=release'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'src/main/cpp/hev/Android.mk' }
    }

    signingConfigs {
        local {
            storeFile file('../keystore/mistick.jks')
            storePassword 'mistick123'
            keyAlias 'mistick'
            keyPassword 'mistick123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.local
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.local
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
