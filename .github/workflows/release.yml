# A version tag: tests, builds every platform and publishes the GitHub release of the tag, the
# `draft` release, TestFlight and Google Play (open testing for .dev tags, production for releases). See build.yml.
name: Release

on:
  # Manual: this fork has no Apple, Microsoft Store or Play signing secrets, so an automatic
  # release run would fail at the iOS build. The release itself is published from the local build.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    # Same grant as ci.yml: with a narrowed block GITHUB_TOKEN got "Resource not accessible by
    # integration" (403) from the create-release API on the v5.2.0 run. The jobs of build.yml
    # ask for their own narrower scopes, except `release`.
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: ${{ github.ref_name }}
      # v5.5.6.dev is a dev build, v5.5.6 a prod one.
      channel: ${{ endsWith(github.ref_name, 'dev') && 'dev' || 'prod' }}
